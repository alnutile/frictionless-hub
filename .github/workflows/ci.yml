name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Pint (PHP style)
        run: vendor/bin/pint --test

      - name: Prettier (frontend style)
        run: npm run format:check

      - name: ESLint
        run: npm run lint:check

      - name: TypeScript
        run: npm run types

  tests:
    name: Unit & feature tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: frictionless
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U frictionless -d testing"
          --health-interval 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: frictionless
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: ${{ matrix.database == 'sqlite' && 'pcov' || 'none' }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # Inertia feature tests resolve page components through the Vite manifest.
      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests with coverage (SQLite)
        if: matrix.database == 'sqlite'
        run: vendor/bin/pest --testsuite=Unit,Feature --parallel --coverage --min=85 --coverage-clover=coverage.xml

      - name: Run tests (Postgres)
        if: matrix.database == 'pgsql'
        run: vendor/bin/pest --configuration=phpunit.pgsql.xml --testsuite=Unit,Feature

      - name: Upload coverage report
        if: always() && matrix.database == 'sqlite'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: sockets
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run browser tests
        run: vendor/bin/pest --testsuite=Browser

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: tests/Browser/Screenshots
          if-no-files-found: ignore

  image:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          tags: frictionless-hub:production
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it like Kubernetes (migrate job, web, worker, scheduler) and smoke test
        run: |
          docker compose -f compose.production.yaml -p frictionless-prod up -d --wait web worker scheduler
          curl -fsS -o /dev/null -w "/up     %{http_code}\n" http://localhost:8090/up
          curl -fsS -o /dev/null -w "/login  %{http_code}\n" http://localhost:8090/login
          test "$(docker compose -f compose.production.yaml -p frictionless-prod exec -T web id -u)" != "0"
          docker compose -f compose.production.yaml -p frictionless-prod exec -T web php artisan db:seed --class=LarkspurScenarioSeeder --force

      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.production.yaml -p frictionless-prod logs

      - name: Stop
        if: always()
        run: docker compose -f compose.production.yaml -p frictionless-prod down -v
